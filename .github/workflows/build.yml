name: ESP32 viewer firmware

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build
        run: pio run -e cyd_esp32
      - name: Package webflash
        run: bash scripts/prepare_webflash.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-viewer-webflash
          path: webflash/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U platformio
      - name: Build firmware
        run: |
          pio run -e cyd_esp32
          bash scripts/prepare_webflash.sh
          cp .pio/build/cyd_esp32/firmware.bin "solar-viewer-cyd_esp32-${GITHUB_REF_NAME}.bin"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: solar-viewer-cyd_esp32-*.bin
          generate_release_notes: true
